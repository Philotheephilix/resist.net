  <!-- Title -->
  <text x="40" y="110" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#1a1a1a" letter-spacing="-2">ResistNet</text>

  <!-- Subtitle -->
  <text x="40" y="140" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" fill="#555">censorship radar · on-chain evidence · volunteer probes · resist-net.vercel.app</text>

