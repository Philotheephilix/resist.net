  <rect x="40" y="158" width="88" height="26" rx="13" fill="#1a1a1a"/>
  <text x="84" y="176" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.5">ETHEREUM</text>

