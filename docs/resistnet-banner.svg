  <!-- Radar pulse rings (decorative, right side) -->
  <circle cx="820" cy="148" r="42" fill="none" stroke="#e24a47" stroke-width="1" opacity="0.10"/>
  <circle cx="820" cy="148" r="28" fill="none" stroke="#e24a47" stroke-width="1" opacity="0.18"/>
